server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源加缓存（文件名带 hash，内容变了文件名就变，所以可以长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端是 SPA：刷新 /index/forum/topic/8 这种路由时，
    # 服务器上没有对应文件，必须 fallback 到 index.html 交给前端路由处理，
    # 否则刷新页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反代到后端容器（backend 是 compose 里的服务名，容器内可直接解析）
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE（/api/ai/chat/stream）必须关掉缓冲 ——
        # 否则 Nginx 会把流攒在缓冲区，前端就看不到"逐字出现"的效果，
        # 而是一起蹦出来（或者干脆卡住）
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 300s;
    }

    # 上传接口放宽体积限制（后端业务层限 5MB，这里给点余量）
    client_max_body_size 10m;
}
