# ============================================================
# 校园论坛系统 —— 一键拉起全部依赖
#
#   docker compose up -d            启动全部（含应用）
#   docker compose up -d mysql redis rabbitmq elasticsearch rustfs   只启动中间件
#   docker compose logs -f backend  看后端日志
#   docker compose down             停止（保留数据）
#   docker compose down -v          停止并删除数据卷（数据全没，慎用）
#
# 密码等敏感值放在同目录的 .env 文件里（.env 已在 .gitignore 中），
# 首次使用请复制 .env.example 为 .env 并填写。
# ============================================================

services:

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: forum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: template
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动会自动执行 sql/ 下的建表脚本（按文件名顺序）
      - ./Jwt-backend/sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: forum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ---------------- RabbitMQ ----------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: forum-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理台 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- Elasticsearch ----------------
  # ⚠️ 版本必须是 **9.x**：Spring Data ES 6.0.5 带的客户端是 elasticsearch-java 9.2.8，
  #    连 8.x 服务端会返回 400（实测：[es/indices.exists] Expecting a response body）。
  #    这里用 9.5.3（与本机曾装过的 9.5.4 同一大版本，客户端兼容）。
  elasticsearch:
    image: elasticsearch:9.5.3
    container_name: forum-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 学习/开发环境关掉安全认证，省去证书配置（生产务必打开）
      xpack.security.enabled: "false"
      # 内存给 512m 就够跑这个小项目，默认 1g 有点浪费
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ---------------- RustFS（S3 兼容对象存储，替代 MinIO）----------------
  # 为什么换掉 MinIO：官方已停止发布社区版（minio/minio 的 latest 被撤），
  # 改用 Rust 写的 S3 兼容实现 RustFS —— 端口和接口都一致，后端代码不用改。
  #
  # ⚠️ 官方提醒：不要使用默认的 rustfsadmin 凭据，所以这里从 .env 读。
  # ⚠️ 容器以非 root 用户（ID 10001）运行，挂宿主机目录要 chown，
  #    所以这里用**命名卷**（Docker 自动处理权限）。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: forum-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfspassword}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 控制台 http://localhost:9001
    volumes:
      - rustfs-data:/data
    healthcheck:
      # RustFS 自带健康检查端点
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- 后端 ----------------
  # 只想跑中间件的话：docker compose up -d mysql redis rabbitmq elasticsearch rustfs
  backend:
    build:
      context: ./Jwt-backend
    container_name: forum-backend
    restart: unless-stopped
    # 容器里访问其它容器要用服务名，所以覆盖掉 application-dev.yml 里的 127.0.0.1
    environment:
      SPRING_PROFILES_ACTIVE: dev,local
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_KEY: ${JWT_KEY:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      AI_API_KEY: ${AI_API_KEY:-}
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfspassword}
      # 容器内互访：用服务名代替 localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/template?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      STORAGE_ENDPOINT: http://rustfs:9000
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  # ---------------- 前端 ----------------
  frontend:
    build:
      context: ./jwt-frontend
    container_name: forum-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  rustfs-data:
